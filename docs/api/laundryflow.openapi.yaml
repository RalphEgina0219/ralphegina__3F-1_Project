  /api/v1/customer/auth/register:
    post:
      summary: Register
      operationId: register
      description: 'Creates the customer profile and its account in one transaction and signs the customer in.'
      parameters: []
      responses: {  }
      tags:
        - 'Customer portal: authentication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  description: 'Must be at least 2 characters. Must not be greater than 255 characters.'
                  example: 'Juan Dela Cruz'
                contact_number:
                  type: string
                  description: 'A PH mobile number. Must match the regex /^09\d{9}$/.'
                  example: '0917 555 0101'
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: juan.delacruz@example.com
                password:
                  type: string
                  description: 'At least 8 characters, with a letter and a number.'
                  example: laundry123
                password_confirmation:
                  type: string
                  description: 'The value and <code>password</code> must match.'
                  example: laundry123
                barangay_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 28
                street_address:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'Purok 3'
                  nullable: true
              required:
                - full_name
                - contact_number
                - email
                - password
                - password_confirmation
                - barangay_id
      security: []
  /api/v1/customer/auth/login:
    post:
      summary: 'Log in'
      operationId: logIn
      description: 'Five failed attempts a minute for the same email and IP answer 429.'
      parameters: []
      responses: {  }
      tags:
        - 'Customer portal: authentication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: maria.santos@example.com
                password:
                  type: string
                  description: ''
                  example: password123
              required:
                - email
                - password
      security: []
  /api/v1/customer/auth/refresh:
    post:
      summary: 'Refresh the token'
      operationId: refreshTheToken
      description: 'An expired token is accepted within JWT_REFRESH_TTL.'
      parameters: []
      responses: {  }
      tags:
        - 'Customer portal: authentication'
