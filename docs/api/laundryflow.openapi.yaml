openapi: 3.0.3
info:
  title: 'LaundryFlow API v1'
  description: 'The REST API of LaundryFlow, the laundry shop management and QR basket tracking system: staff (JWT, api guard) and the customer portal (JWT, customer guard). Built following the course API Master Class in Laravel: versioned at /api/v1, JSON:API-style resources, course error format.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Authentication
    description: "\nStaff sign-in with JWT (course L8): log in, read the current user, refresh and log out.\nStaff accounts are created by the owner in Settings, so there is no public registration."
  -
    name: Baskets
    description: "\nThe reusable QR baskets. Each label is permanent; a lost basket is retired, never deleted."
  -
    name: 'Customer portal'
    description: "\nThe signed-in customer's own orders. Every query is scoped to that customer: another\ncustomer's order answers 404, exactly like one that does not exist, so numbers cannot be probed."
  -
    name: 'Customer portal: authentication'
    description: "\nThe customer guard (JWT), entirely separate from staff sign-in: a customer token is rejected by\nevery staff route, and a staff token by every customer route."
  -
    name: Customers
    description: "\nCustomer profiles and counter registration."
  -
    name: Dashboard
    description: ''
  -
    name: Health
    description: ''
  -
    name: Inventory
    description: "\nSupply items. Stock on hand is computed from the movements, never typed in."
  -
    name: Notifications
    description: "\nThe staff bell: orders ready for pickup and low stock."
  -
    name: Orders
    description: "\nLaundry transactions: take them in, list and find them, and edit their notes and promised time."
  -
    name: Payments
    description: "\nThe payment log and voiding. Sales are the payments collected, voided ones excluded."
  -
    name: Reports
    description: ''
  -
    name: Services
    description: "\nThe price list. Changing a rate never changes old orders: their prices were frozen."
  -
    name: Settings
    description: "\nThe shop profile: a single record, replaced as a whole (PUT)."
  -
    name: Users
    description: "\nStaff accounts, managed by the owner (course L23). Users are never deleted: disabling keeps\ntheir name on the history they made."
  -
    name: 'Wash types'
    description: "\nHow the laundry is washed, with the optional surcharge per kilo and the soaps each one uses.\nStaff read them to take orders; only the owner changes them (Settings > Pricing & Usage).\nChanges apply to new orders only: an order freezes its wash type surcharge when it is made."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Log in with <code>POST /api/v1/auth/login</code> (staff: <code>liza.ramos</code> / <code>password123</code>) or <code>POST /api/v1/customer/auth/login</code> (customers), and paste the <code>access_token</code> here. Send it as <code>Authorization: Bearer {token}</code>. Tokens last JWT_TTL minutes; exchange an expired one with <code>/auth/refresh</code>.'
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: 'Log in'
      operationId: logIn
      description: "Returns an access token. Send it as a Bearer token on every other request. Five failed\nattempts a minute for the same username and IP answer 429."
      parameters: []
      responses: {  }
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 'The staff username. Must not be greater than 50 characters.'
                  example: liza.ramos
                password:
                  type: string
                  description: 'The password.'
                  example: password123
                remember:
                  type: boolean
                  description: 'Kept for the sign-in form; tokens are refreshed instead.'
                  example: false
              required:
                - username
                - password
      security: []
  /api/v1/auth/refresh:
    post:
      summary: 'Refresh the token'
      operationId: refreshTheToken
      description: "Blacklists the current token (an expired one is accepted within JWT_REFRESH_TTL) and returns\na new one carrying the user's current abilities."
      parameters: []
      responses: {  }
      tags:
        - Authentication
  /api/v1/auth/logout:
    post:
      summary: 'Log out'
      operationId: logOut
      description: 'Blacklists the current token so it can never be used again.'
      parameters: []
      responses: {  }
      tags:
        - Authentication
  /api/v1/auth/me:
    get:
      summary: 'Current user'
      operationId: currentUser
      description: 'Returns the staff member who owns the Bearer token, with their role and permissions.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      status: 401
                      message: Unauthenticated
                      source: ''
                properties:
                  errors:
                    type: array
                    example:
                      -
                        status: 401
                        message: Unauthenticated
                        source: ''
                    items:
                      type: object
                      properties:
                        status:
                          type: integer
                          example: 401
                        message:
                          type: string
                          example: Unauthenticated
                        source:
                          type: string
                          example: ''
      tags:
        - Authentication
  /api/v1/auth/password:
    put:
      summary: 'Change my password'
      operationId: changeMyPassword
      description: 'Also allowed while a password change is pending.'
      parameters: []
      responses: {  }
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  description: 'The current password, or the temporary one the owner or shop gave.'
                  example: k7m2p9qx4t
                password:
                  type: string
                  description: 'At least 8 characters, with a letter and a number, different from the current one.'
                  example: laundry2026
                password_confirmation:
                  type: string
                  description: 'The new password again. The value and <code>password</code> must match.'
                  example: laundry2026
              required:
                - current_password
                - password
                - password_confirmation
  /api/v1/baskets/available:
    get:
      summary: 'List the baskets free for a new order'
      operationId: listTheBasketsFreeForANewOrder
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      status: 401
                      message: Unauthenticated
                      source: ''
                properties:
                  errors:
                    type: array
                    example:
                      -
                        status: 401
                        message: Unauthenticated
                        source: ''
                    items:
                      type: object
                      properties:
                        status:
                          type: integer
                          example: 401
                        message:
                          type: string
                          example: Unauthenticated
                        source:
                          type: string
                          example: ''
      tags:
        - Baskets
  /api/v1/baskets:
    get:
      summary: 'List baskets'
      operationId: listBaskets
      description: 'By number. `meta.counts` has the number of baskets in each status.'
      parameters:
        -
          in: query
          name: status
          description: 'available, in_use or retired.'
          example: available
          required: false
          schema:
            type: string
            description: 'available, in_use or retired.'
            example: available
        -
          in: query
          name: search
          description: 'Basket number, label or the order it holds.'
          example: '0007'
          required: false
          schema:
            type: string
            description: 'Basket number, label or the order it holds.'
            example: '0007'
        -
          in: query
          name: sort
          description: 'basketNumber, status or createdAt.'
          example: basketNumber
          required: false
          schema:
            type: string
            description: 'basketNumber, status or createdAt.'
            example: basketNumber
        -
          in: query
          name: page
          description: 'The page number.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'The page number.'
            example: 1
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      status: 401
                      message: Unauthenticated
                      source: ''
                properties:
                  errors:
                    type: array
                    example:
                      -
                        status: 401
                        message: Unauthenticated
                        source: ''
                    items:
                      type: object
                      properties:
                        status:
                          type: integer
                          example: 401
                        message:
                          type: string
                          example: Unauthenticated
                        source:
                          type: string
                          example: ''
      tags:
        - Baskets
    post:
      summary: 'Add baskets'
      operationId: addBaskets
      description: "1 to 100 at a time. Numbers continue after the highest ever issued; each basket gets its own\npermanent 32-character QR token."
      parameters: []
      responses: {  }
      tags:
        - Baskets
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: ''
                  example: null
                  properties:
                    attributes:
                      type: object
                      description: ''
                      example: null
                      properties:
                        count:
                          type: integer
                          description: 'How many baskets to add (1–100). Must be at least 1. Must not be greater than 100.'
                          example: 10
                        label:
                          type: string
                          description: 'A label for all of them. Must not be greater than 100 characters.'
                          example: 'Blue, large'
                          nullable: true
  '/api/v1/baskets/{id}':
    get:
      summary: 'Show a basket'
      operationId: showABasket
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      status: 401
                      message: Unauthenticated
                      source: ''
                properties:
                  errors:
                    type: array
                    example:
                      -
                        status: 401
                        message: Unauthenticated
                        source: ''
                    items:
                      type: object
                      properties:
                        status:
                          type: integer
                          example: 401
                        message:
                          type: string
                          example: Unauthenticated
                        source:
                          type: string
                          example: ''
      tags:
        - Baskets
    patch:
      summary: "Update a basket's label or notes"
      operationId: updateABasketsLabelOrNotes
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Baskets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: ''
                  example: []
                  properties:
                    attributes:
                      type: object
                      description: ''
                      example: []
                      properties:
                        label:
                          type: string
                          description: 'Must not be greater than 100 characters.'
                          example: 'Green, large'
                          nullable: true
                        notes:
                          type: string
                          description: 'Must not be greater than 255 characters.'
                          example: 'Handle taped'
                          nullable: true
                  required:
                    - attributes
              required:
                - data
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the basket.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/baskets/{basket_id}':
    put:
      summary: "Replace a basket's label and notes"
      operationId: replaceABasketsLabelAndNotes
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Baskets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: ''
                  example: []
                  properties:
                    attributes:
                      type: object
                      description: ''
                      example: []
                      properties:
                        label:
                          type: string
                          description: 'Must not be greater than 100 characters.'
                          example: 'Green, large'
                          nullable: true
                        notes:
                          type: string
                          description: 'Must not be greater than 255 characters.'
                          example: 'Handle taped'
                          nullable: true
                  required:
                    - attributes
              required:
                - data
    parameters:
      -
        in: path
        name: basket_id
        description: 'The ID of the basket.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/baskets/{basket_id}/retire':
    post:
      summary: 'Retire a basket'
      operationId: retireABasket
      description: "For a lost or broken basket: kept with its history, its number never reused.\n409 while it holds an order or when already retired."
      parameters: []
      responses: {  }
      tags:
        - Baskets
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: ''
                  example:
                    attributes:
                      reason: 'Cracked handle, replaced'
                  properties:
                    attributes:
                      type: object
                      description: ''
                      example:
                        reason: 'Cracked handle, replaced'
                      properties:
                        reason:
                          type: string
                          description: 'Why it is retired.'
                          example: 'Cracked handle, replaced'
    parameters:
      -
        in: path
        name: basket_id
        description: 'The ID of the basket.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/baskets/{basket_id}/history':
    get:
      summary: "A basket's history"
      operationId: aBasketsHistory
      description: 'Every order it held, newest first, 10 per page.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      status: 401
                      message: Unauthenticated
                      source: ''
                properties:
                  errors:
                    type: array
                    example:
                      -
                        status: 401
                        message: Unauthenticated
                        source: ''
                    items:
                      type: object
                      properties:
                        status:
                          type: integer
                          example: 401
                        message:
                          type: string
                          example: Unauthenticated
                        source:
                          type: string
                          example: ''
      tags:
        - Baskets
    parameters:
      -
        in: path
        name: basket_id
        description: 'The ID of the basket.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/scan/{code}':
    get:
      summary: 'Look up a scanned or typed code'
      operationId: lookUpAScannedOrTypedCode
      description: "`code` is a basket label URL (…/b/{token}), a bare token, a basket number (BSK-0007) or an\norder number (LF-261108-0001). A basket answers with its active order (or null when it is\navailable, retired, or its last order is completed); an order number answers with the order."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    -
                      status: 401
                      message: Unauthenticated
                      source: ''
                properties:
                  errors:
                    type: array
                    example:
                      -
                        status: 401
                        message: Unauthenticated
                        source: ''
                    items:
                      type: object
                      properties:
                        status:
                          type: integer
                          example: 401
                        message:
                          type: string
                          example: Unauthenticated
                        source:
                          type: string
                          example: ''
      tags:
        - Baskets
    parameters:
      -
        in: path
        name: code
        description: 'The scanned text.'
        example: BSK-0007
        required: true
        schema:
          type: string
  /api/v1/customer/account:
    patch:
      summary: 'Update my details'
      operationId: updateMyDetails
      description: "Only the phone number, barangay and street address. The name, email and the shop's notes\nstay with the shop."
      parameters: []
      responses: {  }
      tags:
        - 'Customer portal'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: ''
                  example: []
                  properties:
                    attributes:
                      type: object
                      description: ''
                      example: []
                      properties:
                        contactNumber:
                          type: string
                          description: ''
                          example: '0917 845 2210'
                        streetAddress:
                          type: string
                          description: ''
                          example: 'Purok 2'
                          nullable: true
                    relationships:
                      type: object
                      description: ''
                      example: []
                      properties:
                        barangay:
                          type: object
                          description: ''
                          example: []
                          properties:
                            data:
                              type: object
                              description: ''
                              example: []
                              properties:
                                id:
                                  type: integer
                                  description: ''
                                  example: 28
  /api/v1/customer/orders:
    get:
      summary: 'My orders'
      operationId: myOrders
      description: "Newest first. `meta.active` and `meta.completed` count the customer's orders."
      parameters:
        -
          in: query
          name: status
          description: 'active or completed.'
          example: active
          required: false
          schema:
            type: string
            description: 'active or completed.'
            example: active
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      type: portalOrder
                      id: LF-261110-0009
                      attributes:
                        orderNumber: LF-261110-0009
                        receivedAt: '2026-11-10T01:20:00.000Z'
                        promisedAt: '2026-11-11T02:00:00.000Z'
                        releasedAt: null
                        status: washing
                        statusLabel: Washing
                        totalCents: 36750
                        paidCents: 20000
                        balanceCents: 16750
                        paymentStatus: partial
                      links:
                        self: 'http://laundryflow.test/api/v1/customer/orders/LF-261110-0009'
                      includes:
                        baskets:
                          -
                            type: basket
                            id: 20
                            attributes:
                              basketNumber: BSK-0020
                        items:
                          -
                            type: orderItem
                            id: 2170
                            attributes:
                              weightKg: 6.5
                              quantity: null
                              unitPriceCents: 3500
                              subtotalCents: 22750
                              serviceName: Wash-Dry-Fold
                              pricingType: per_kg
                  links:
                    first: 'http://laundryflow.test/api/v1/customer/orders?page=1'
                    last: 'http://laundryflow.test/api/v1/customer/orders?page=4'
                    prev: null
                    next: 'http://laundryflow.test/api/v1/customer/orders?page=2'
                  meta:
                    current_page: 1
                    last_page: 4
                    per_page: 1
                    total: 4
                    active: 1
                    completed: 3
                properties:
                  data:
                    type: array
                    example:
                      -
                        type: portalOrder
                        id: LF-261110-0009
                        attributes:
                          orderNumber: LF-261110-0009
                          receivedAt: '2026-11-10T01:20:00.000Z'
                          promisedAt: '2026-11-11T02:00:00.000Z'
                          releasedAt: null
                          status: washing
                          statusLabel: Washing
                          totalCents: 36750
                          paidCents: 20000
                          balanceCents: 16750
                          paymentStatus: partial
                        links:
                          self: 'http://laundryflow.test/api/v1/customer/orders/LF-261110-0009'
                        includes:
                          baskets:
                            -
                              type: basket
                              id: 20
                              attributes:
                                basketNumber: BSK-0020
                          items:
                            -
                              type: orderItem
                              id: 2170
                              attributes:
                                weightKg: 6.5
                                quantity: null
                                unitPriceCents: 3500
                                subtotalCents: 22750
                                serviceName: Wash-Dry-Fold
                                pricingType: per_kg
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: portalOrder
                        id:
                          type: string
                          example: LF-261110-0009
                        attributes:
                          type: object
                          properties:
                            orderNumber:
                              type: string
                              example: LF-261110-0009
                            receivedAt:
                              type: string
                              example: '2026-11-10T01:20:00.000Z'
                            promisedAt:
                              type: string
                              example: '2026-11-11T02:00:00.000Z'
                            releasedAt:
                              type: string
                              example: null
                              nullable: true
                            status:
                              type: string
                              example: washing
                            statusLabel:
                              type: string
                              example: Washing
                            totalCents:
                              type: integer
                              example: 36750
                            paidCents:
                              type: integer
                              example: 20000
                            balanceCents:
                              type: integer
                              example: 16750
                            paymentStatus:
                              type: string
                              example: partial
                        links:
                          type: object
                          properties:
                            self:
                              type: string
                              example: 'http://laundryflow.test/api/v1/customer/orders/LF-261110-0009'
                        includes:
                          type: object
                          properties:
                            baskets:
                              type: array
                              example:
                                -
                                  type: basket
                                  id: 20
                                  attributes:
                                    basketNumber: BSK-0020
                              items:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    example: basket
                                  id:
                                    type: integer
                                    example: 20
                                  attributes:
                                    type: object
                                    properties:
                                      basketNumber: { type: string, example: BSK-0020 }
                            items:
                              type: array
                              example:
                                -
                                  type: orderItem
                                  id: 2170
                                  attributes:
                                    weightKg: 6.5
                                    quantity: null
                                    unitPriceCents: 3500
                                    subtotalCents: 22750
                                    serviceName: Wash-Dry-Fold
                                    pricingType: per_kg
                              items:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    example: orderItem
                                  id:
                                    type: integer
                                    example: 2170
                                  attributes:
                                    type: object
                                    properties:
                                      weightKg: { type: number, example: 6.5 }
                                      quantity: { type: string, example: null, nullable: true }
                                      unitPriceCents: { type: integer, example: 3500 }
                                      subtotalCents: { type: integer, example: 22750 }
                                      serviceName: { type: string, example: Wash-Dry-Fold }
                                      pricingType: { type: string, example: per_kg }
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'http://laundryflow.test/api/v1/customer/orders?page=1'
                      last:
                        type: string
                        example: 'http://laundryflow.test/api/v1/customer/orders?page=4'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: 'http://laundryflow.test/api/v1/customer/orders?page=2'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 4
                      per_page:
                        type: integer
                        example: 1
                      total:
                        type: integer
                        example: 4
                      active:
                        type: integer
                        example: 1
                      completed:
                        type: integer
                        example: 3
      tags:
        - 'Customer portal'
  '/api/v1/customer/orders/{orderNumber}':
    get:
      summary: 'One of my orders'
      operationId: oneOfMyOrders
      description: "By its order number. No staff names, notes or voided payments. Another customer's order\nnumber answers 404, exactly like one that does not exist."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    type: portalOrder
                    id: LF-261110-0009
                    attributes:
                      orderNumber: LF-261110-0009
                      receivedAt: '2026-11-10T01:20:00.000Z'
                      promisedAt: '2026-11-11T02:00:00.000Z'
                      releasedAt: null
                      status: washing
                      statusLabel: Washing
                      totalCents: 36750
                      paidCents: 20000
                      balanceCents: 16750
                      paymentStatus: partial
                      customer:
                        fullName: 'Maria Santos'
                        contactNumber: '09178452210'
                      timeline:
                        -
                          status: received
                          label: Received
                          at: '2026-11-10T01:20:00.000Z'
                        -
                          status: washing
                          label: Washing
                          at: '2026-11-10T02:54:00.000Z'
                        -
                          status: drying
                          label: Drying
                          at: null
                        -
                          status: folding
                          label: Folding
                          at: null
                        -
                          status: ready_for_pickup
                          label: 'Ready for Pickup'
                          at: null
                        -
                          status: released
                          label: Completed
                          at: null
