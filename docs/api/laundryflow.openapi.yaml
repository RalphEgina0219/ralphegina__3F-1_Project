  /api/v1/customer/account/password:
    put:
      summary: 'Change my password'
      operationId: changeMyPassword
      description: 'Allowed while a password change is pending; clears must_change_password.'
      parameters: []
      responses: {  }
      tags:
        - 'Customer portal: authentication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  description: 'The current password, or the temporary one the owner or shop gave.'
                  example: k7m2p9qx4t
                password:
                  type: string
                  description: 'At least 8 characters, with a letter and a number, different from the current one.'
                  example: laundry2026
                password_confirmation:
                  type: string
                  description: 'The new password again. The value and <code>password</code> must match.'
                  example: laundry2026
              required:
                - current_password
                - password
                - password_confirmation
