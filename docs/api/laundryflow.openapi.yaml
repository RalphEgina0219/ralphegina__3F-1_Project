  /api/v1/analytics/dashboard:
    get:
      summary: 'Dashboard analytics'
      operationId: dashboardAnalytics
      description: "The dashboard's KPIs and charts for a Manila date range, compared with the range of the same\nlength just before it. Users with sales.view get the admin document; everyone else gets the\nstaff document, which is built without a single peso field (not hidden: never sent).\n\nThe document is not a model resource: it is the analytics envelope\n{ range, compare_range, generated_at, kpis, series, table, insights }, inside ok()."
      parameters:
        -
          in: query
          name: from
          description: 'First Manila day (Y-m-d). Defaults to 29 days ago.'
          example: '2026-10-10'
          required: false
          schema:
            type: string
            description: 'First Manila day (Y-m-d). Defaults to 29 days ago.'
            example: '2026-10-10'
        -
          in: query
          name: to
          description: 'Last Manila day, inclusive. Defaults to today.'
          example: '2026-11-08'
          required: false
          schema:
            type: string
            description: 'Last Manila day, inclusive. Defaults to today.'
            example: '2026-11-08'
        -
          in: query
          name: compare
          description: 'previous (default) or none.'
          example: previous
          required: false
          schema:
            type: string
            description: 'previous (default) or none.'
            example: previous
