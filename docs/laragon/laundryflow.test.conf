# LaundryFlow API on Laragon's Apache: http://laundryflow.test -> laravel-backend/public
#
# Copy this file to C:\laragon\etc\apache2\sites-enabled\laundryflow.test.conf (keep the name: Laragon
# rewrites only the auto.*.conf files), add "127.0.0.1 laundryflow.test" to
# C:\Windows\System32\drivers\etc\hosts (as administrator), then Menu > Apache > Reload.
# Change the two paths if the project is not in C:\laragon\www\Final_Project_WST&AppDev.
<VirtualHost *:80>
    ServerName laundryflow.test
    DocumentRoot "C:/laragon/www/Final_Project_WST&AppDev/laravel-backend/public"
    <Directory "C:/laragon/www/Final_Project_WST&AppDev/laravel-backend/public">
        AllowOverride All
        Require all granted
    </Directory>
    # The JWT arrives in the Authorization header; Apache must pass it on to PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
</VirtualHost>
