name: Health
description: ''
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/health
    metadata:
      custom: []
      groupName: Health
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Check the API'
      description: |-
        Answers 200 when the API runs and its database accepts queries, and 503 when the database
        cannot be reached. It never returns data from the database. Docker's health check and the
        frontend's dev server call it.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"data": {"status": "ok", "database": "ok"}, "message": "OK", "status": 200}'
        headers: []
        description: ''
      -
        custom: []
        status: 503
        content: '{"errors": [{"status": 503, "message": "The database is not reachable.", "source": "database"}]}'
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
