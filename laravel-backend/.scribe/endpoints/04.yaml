name: Reports
description: ''
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: 'api/v1/reports/{kind}'
    metadata:
      custom: []
      groupName: Reports
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'A report'
      description: |-
        One of seven reports (owner only): sales, orders, payments, services, customers, inventory or
        staff. Same envelope as the dashboard analytics, plus a full table. For the same range the
        sales total equals the dashboard KPI and GET /payments meta.collectedCents.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      kind:
        custom: []
        name: kind
        description: 'sales, orders, payments, services, customers, inventory or staff.'
        required: true
        example: sales
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      kind: sales
    queryParameters:
      from:
        custom: []
        name: from
        description: 'First Manila day (Y-m-d).'
        required: false
        example: '2026-10-10'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      to:
        custom: []
        name: to
        description: 'Last Manila day, inclusive.'
        required: false
        example: '2026-11-08'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      compare:
        custom: []
        name: compare
        description: 'previous (default) or none.'
        required: false
        example: previous
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      service:
        custom: []
        name: service
        description: 'One service (payments split by allocation).'
        required: false
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      method:
        custom: []
        name: method
        description: 'cash or gcash.'
        required: false
        example: gcash
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      status:
        custom: []
        name: status
        description: 'One status code.'
        required: false
        example: ready_for_pickup
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      staff:
        custom: []
        name: staff
        description: 'One staff member.'
        required: false
        example: 2
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      barangay:
        custom: []
        name: barangay
        description: 'One barangay by name.'
        required: false
        example: Poblacion
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      item:
        custom: []
        name: item
        description: 'One supply item.'
        required: false
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanQueryParameters:
