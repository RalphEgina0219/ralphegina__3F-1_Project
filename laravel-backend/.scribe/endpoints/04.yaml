      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      from:
        custom: []
        name: from
        description: 'First Manila day (Y-m-d). Defaults to 29 days ago.'
        required: false
        example: '2026-10-10'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      to:
        custom: []
        name: to
        description: 'Last Manila day, inclusive. Defaults to today.'
        required: false
