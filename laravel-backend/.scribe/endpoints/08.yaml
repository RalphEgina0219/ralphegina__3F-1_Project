        Staff read them to take orders; only the owner changes them (Settings > Pricing & Usage).
        Changes apply to new orders only: an order freezes its wash type surcharge when it is made.
      subgroup: ''
      subgroupDescription: ''
      title: 'List wash types'
      description: "In the order they are shown (sortOrder). `meta.blockOrdersOnLowSoap` is the shop's stock rule."
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
