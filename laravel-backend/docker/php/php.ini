; Development settings for the LaundryFlow API container.
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
date.timezone = Asia/Manila
expose_php = Off

; Errors go to the log (docker compose logs app), never into a JSON answer.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; OPcache with timestamp checks on every request, so code edits show immediately.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; The code is on a bind mount from Windows, where each file lookup is slow: remember them longer.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
