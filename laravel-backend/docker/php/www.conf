; Loaded after the image's www.conf, so these lines win.
[www]
; The container already runs as the non-root app user; FPM cannot switch users anyway.
listen = 9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; The health check asks FPM itself for "pong" (cgi-fcgi), without running Laravel.
ping.path = /ping
ping.response = pong
; Keep the container's environment (DB_* from compose.yaml) visible to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; nginx already logs every request: no second access log (and no health-check pings in the logs).
access.log = /dev/null
